<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT EDGE — Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080a0f;
  color:#f4f6f8;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#10131a;
  border:1px solid #232832;
  border-radius:18px;
  padding:32px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#8ee6b1;
}

.subtitle{
  text-align:center;
  color:#929aa7;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#cdd3dc;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:18px;
  border-radius:9px;
  border:1px solid #303641;
  background:#0d1117;
  color:white;
  outline:none;
}

input:focus{
  border-color:#8ee6b1;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  background:#8ee6b1;
  color:#07100b;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:.9;
}

#message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  color:#8ee6b1;
}

.signup{
  text-align:center;
  margin-top:20px;
  color:#929aa7;
  font-size:14px;
}

.signup a{
  color:#8ee6b1;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    ICT <span>EDGE</span>
  </div>

  <p class="subtitle">Login to your trading account</p>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">Login</button>

  </form>

  <div id="message"></div>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnYm5wc3NwdmNvbXR1dGt6dm14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDM3MjAsImV4cCI6MjEwNDc

const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    message.textContent = error.message;
    return;
  }

  message.textContent = "Login successful!";

  setTimeout(function(){
    window.location.href = "index.html";
  }, 800);

});

</script>

</body>
</html>
